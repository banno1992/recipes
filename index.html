<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Recipes</title>
  <meta name="theme-color" content="#fbf8f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1917" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="back" id="back" aria-label="Back" hidden>
      <svg viewBox="0 0 24 24" width="24" height="24"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1 id="title">Recipes</h1>
    <span class="awake" id="awake" hidden>Screen on</span>
  </header>

  <main id="view"></main>

  <nav class="tabs" id="tabs">
    <a href="#/" data-tab="pick">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.4" class="f"/><circle cx="15.5" cy="15.5" r="1.4" class="f"/><circle cx="12" cy="12" r="1.4" class="f"/></svg>
      <span>Pick</span>
    </a>
    <a href="#/week" data-tab="week">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>This week</span><b class="badge" id="weekBadge" hidden></b>
    </a>
    <a href="#/list" data-tab="list">
      <svg viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12"/><path d="M3.5 6l1.2 1.2L7 5M3.5 12l1.2 1.2L7 11M3.5 18l1.2 1.2L7 17"/></svg>
      <span>Shopping</span>
    </a>
    <a href="#/all" data-tab="all">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <span>All</span>
    </a>
  </nav>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <div class="sheet" id="sheet" hidden></div>
  <div class="toast" id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
